name: 给iOS16.4+越狱设备编译llama.cpp-Metal（修复Metal崩溃版）

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装Cmake和Ninja和Ldid
        run: brew install cmake ninja ldid

      - name: 下载并解压llama.cpp源码
        run: |
          curl -L -o llama.cpp-1.0.0.zip https://github.com/ggml-org/llama.cpp/archive/refs/tags/v1.0.0.zip
          unzip -q llama.cpp-1.0.0.zip

      # ★ 新增：打 Metal buffer 修复补丁（解决 GGML_ASSERT(buf_dst) 崩溃）
      - name: 修复Metal buffer bug
        run: |
          cat > apply_metal_fix.py <<'PYEOF'
          import sys, os, re
          root = "llama.cpp-1.0.0"
          path = os.path.join(root, "ggml/src/ggml-metal/ggml-metal-context.m")
          src = open(path, encoding="utf-8").read()

          inc_anchor = '#import <Metal/Metal.h>'
          inc_add = '#import <Metal/Metal.h>\n\n#include <stdlib.h>\n#include <string.h>\n#include <unistd.h>'
          if '#include <stdlib.h>' not in src:
              assert inc_anchor in src, "找不到 Metal.h import 锚点"
              src = src.replace(inc_anchor, inc_add, 1)

          sig = 'void ggml_metal_get_tensor_async('
          start = src.index(sig)
          m = re.search(r'\n\}\s*\n', src[start:])
          assert m, "找不到 get_tensor_async 函数结尾"
          end = start + m.end()

          new_func = r'''void ggml_metal_get_tensor_async(ggml_metal_t ctx, const struct ggml_tensor * tensor, void * data, size_t offset, size_t size) {
              @autoreleasepool {
                  if (size == 0) {
                      return;
                  }

                  id<MTLDevice> device = ggml_metal_device_get_obj(ctx->dev);
                  const size_t page_size = (size_t)sysconf(_SC_PAGESIZE);
                  const bool can_wrap = (((uintptr_t)data % page_size) == 0) && ((size % page_size) == 0);

                  id<MTLBuffer> buf_dst = nil;
                  if (can_wrap) {
                      buf_dst = [device newBufferWithBytesNoCopy:data
                                                          length:size
                                                         options:MTLResourceStorageModeShared
                                                     deallocator:nil];
                      GGML_ASSERT(buf_dst);
                  }

                  struct ggml_metal_buffer_id bid_src = ggml_metal_get_buffer_id(tensor);
                  if (bid_src.metal == nil) {
                      GGML_ABORT("%s: failed to find buffer for tensor '%s'\n", __func__, tensor->name);
                  }
                  bid_src.offs += offset;

                  id<MTLCommandQueue> queue = ggml_metal_device_get_queue(ctx->dev);
                  id<MTLCommandBuffer> cmd_buf = [queue commandBuffer];
                  id<MTLBlitCommandEncoder> encoder = [cmd_buf blitCommandEncoder];

                  if (buf_dst) {
                      [encoder copyFromBuffer:bid_src.metal
                                 sourceOffset:bid_src.offs
                                     toBuffer:buf_dst
                            destinationOffset:0
                                         size:size];
                      [encoder endEncoding];
                      [cmd_buf commit];
                      [ctx->buf_refs addObject:buf_dst];
                      [buf_dst release];
                      [ctx->cmd_bufs_ext addObject:cmd_buf];
                      ctx->cmd_buf_last = cmd_buf;
                      [cmd_buf retain];
                      return;
                  }

                  GGML_LOG_WARN("%s: host buffer not page-wrappable (ptr=%p size=%zu), using sync copy\n", __func__, data, size);
                  const size_t staging_size = (size + page_size - 1) & ~(page_size - 1);
                  void * staging_data = NULL;
                  if (posix_memalign(&staging_data, page_size, staging_size) != 0) {
                      GGML_ABORT("%s: failed to allocate staging buffer\n", __func__);
                  }
                  id<MTLBuffer> buf_staging = [device newBufferWithBytesNoCopy:staging_data
                                                                       length:staging_size
                                                                      options:MTLResourceStorageModeShared
                                                                  deallocator:nil];
                  if (buf_staging == nil) {
                      free(staging_data);
                      GGML_ABORT("%s: failed to create staging buffer\n", __func__);
                  }
                  [encoder copyFromBuffer:bid_src.metal
                             sourceOffset:bid_src.offs
                                 toBuffer:buf_staging
                        destinationOffset:0
                                     size:size];
                  [encoder endEncoding];
                  [cmd_buf commit];
                  [cmd_buf waitUntilCompleted];
                  memcpy(data, buf_staging.contents, size);
                  [buf_staging release];
                  free(staging_data);
              }
          }
          '''
          src = src[:start] + new_func + src[end:]
          open(path, "w", encoding="utf-8").write(src)
          print("PATCH OK")
          PYEOF
          python3 apply_metal_fix.py

      - name: 下载并解压sdk文件
        run: |
          curl -L -o iPhoneOS17.5.sdk.zip https://github.com/xybp888/iOS-SDKs/releases/download/iOS17.5-SDKs/iPhoneOS17.5.sdk.zip
          unzip -q iPhoneOS17.5.sdk.zip

      - name: 配置
        run: |
          set -o pipefail
          export HF_UI_VERSION=b12359
          cmake -S llama.cpp-1.0.0 -B build -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_SYSTEM_PROCESSOR=arm64 \
            -DCMAKE_OSX_SYSROOT=./iPhoneOS17.5.sdk \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=16.4 \
            -DCMAKE_MACOSX_BUNDLE=OFF \
            -DBUILD_SHARED_LIBS=OFF \
            -LAH 2>&1 | tee cmake-LAH.txt

      - name: 编译 llama-cli 与 llama-server
        run: cmake --build build --target llama-cli llama-server -j "$(sysctl -n hw.ncpu)"

      - name: 校验架构并伪签名
        run: |
          file build/bin/llama-cli build/bin/llama-server
          ldid -S build/bin/llama-cli
          ldid -S build/bin/llama-server

      - name: 打包产物与配置缓存
        run: |
          mkdir -p package
          cp build/bin/llama-cli build/bin/llama-server cmake-LAH.txt package/
          file package/llama-cli package/llama-server
          ls -lh package/

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: llama-cli-server-ios-metal-fixed
          path: package/
          if-no-files-found: error
